name: Publish repository index

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "25 * * * *"
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo
          pip install semver filetype pyyaml
      - name: Build repodata.json
        run: python3 createrepo.py .
      - name: Stage Pages site
        run: |
          mkdir -p public
          cp repodata.json public/
          for dir in */; do
            [ -f "${dir}metadata.json" ] || continue
            cp -a "$dir" public/
          done
          python3 - <<'PY'
          import json
          data = json.load(open("public/repodata.json"))
          by_id = {entry["id"]: entry for entry in data}
          assert "n8n" in by_id, data
          tags = [v["tag"] for v in by_id["n8n"]["versions"]]
          assert tags, "no n8n tags visible in ghcr.io/antonwantstosleep/n8n"
          print("indexed n8n", tags)
          assert "nextcloud-mcp-server" not in by_id
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
